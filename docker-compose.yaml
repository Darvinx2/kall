# Значения подставляются из .env через ${VAR:-default}.
# Compose читает .env из каталога проекта сам, указывать его не нужно.
#
# Порты на хосте разведены со стандартными: 5432 и 6379 заняты другим проектом.
# Внутри сети compose службы доступны по именам сервисов на стандартных портах.
#
# Журналы служб в файлы не выводятся — читаются через `docker compose logs`.

name: university

services:
  postgres:
    image: postgres:16-alpine
    container_name: uni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-university}
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан в .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-university} -d ${POSTGRES_DB:-university}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: uni-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --dir
      - /data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    container_name: uni-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-university}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?не задан в .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-university}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: uni-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?не задан в .env}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_PORT:-7475}:7474"
      - "${NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: uni-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.name: university-cluster
    ports:
      - "${ELASTIC_PORT:-9201}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  lab1:
    build:
      context: .
      dockerfile: lab1/Dockerfile
    container_name: uni-lab1
    restart: unless-stopped
    # Токен проверяет только gateway. lab1 доверяет тому, что запрос
    # пришёл из сети compose — порт наружу не публикуется, снаружи
    # достучаться до сервиса невозможно.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-university}
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан в .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?не задан в .env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  lab2:
    build:
      context: .
      dockerfile: lab2/Dockerfile
    container_name: uni-lab2
    restart: unless-stopped
    # Токен проверяет только gateway. lab2 доверяет тому, что запрос
    # пришёл из сети compose — порт наружу не публикуется, снаружи
    # достучаться до сервиса невозможно.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-university}
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан в .env}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  lab3:
    build:
      context: .
      dockerfile: lab3/Dockerfile
    container_name: uni-lab3
    restart: unless-stopped
    # Токен проверяет только gateway. lab3 доверяет тому, что запрос
    # пришёл из сети compose — порт наружу не публикуется, снаружи
    # достучаться до сервиса невозможно.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-university}
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан в .env}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?не задан в .env}
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: uni-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?не задан в .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
      JWT_ISSUER: ${JWT_ISSUER:-university-gateway}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-university-labs}
      # Внутри сети compose lab1 адресуется по имени сервиса и своему
      # внутреннему порту 8000 — не по 8001, опубликованному на хост.
      LAB1_URL: http://lab1:8000
      LAB2_URL: http://lab2:8000
      LAB3_URL: http://lab3:8000
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      lab1: { condition: service_healthy }
      lab2: { condition: service_healthy }
      lab3: { condition: service_healthy }

  generator:
    build:
      # Контекст — корень репозитория: Dockerfile копирует pyproject.toml,
      # uv.lock и пакет generator/, а выйти за пределы контекста нельзя.
      context: .
      dockerfile: generator/Dockerfile
    container_name: uni-generator
    profiles: ["seed"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    # Имена переменных совпадают с полями Settings в generator/app/config.py.
    # Здесь они перекрывают дефолты из .env: внутри сети адреса другие.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-university}
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан в .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-university}
      MONGO_USER: ${MONGO_USER:-university}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?не задан в .env}
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?не задан в .env}
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  neo4j_data:
  es_data:
